name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --python ${{ matrix.python-version }}

      - name: Run tests
        run: make test

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Sync environment
        run: uv sync --python 3.13

      - name: Build distributions
        run: make build

      - name: Check distributions
        run: uvx --from twine twine check dist/*

      - name: Smoke-test the notamify command
        run: |
          python -m venv /tmp/cli
          /tmp/cli/bin/pip install dist/notamify_sdk-*.whl dist/notamify-*.whl
          /tmp/cli/bin/notamify --version
          /tmp/cli/bin/notamify commands --json > /dev/null
