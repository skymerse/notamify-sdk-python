name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Ensure tag matches package versions
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          SDK_VERSION="$(grep -E '^version = ' pyproject.toml | head -n1 | sed -E 's/version = "([^"]+)"/\1/')"
          CLI_VERSION="$(grep -E '^version = ' cli/pyproject.toml | head -n1 | sed -E 's/version = "([^"]+)"/\1/')"
          CLI_PIN="$(grep -Eo 'notamify-sdk==[^"]+' cli/pyproject.toml | cut -d= -f3)"
          for pair in "notamify-sdk:${SDK_VERSION}" "notamify:${CLI_VERSION}" "notamify-sdk pin in cli/pyproject.toml:${CLI_PIN}"; do
            if [ "${TAG_VERSION}" != "${pair##*:}" ]; then
              echo "::error::Git tag ${TAG_VERSION} does not match ${pair%:*} version ${pair##*:}"
              exit 1
            fi
          done

      - name: Sync environment
        run: uv sync --python 3.13

      - name: Run tests
        run: uv run python -m unittest discover -s tests -p 'test_*.py'

      - name: Build distributions
        run: make build

      - name: Check distributions
        run: uvx --from twine twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: release-dists
          path: |
            dist/notamify_sdk-*
            dist/notamify-*
          if-no-files-found: error

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist

      # notamify pins notamify-sdk==<version>, so the SDK must be on PyPI first.
      - name: Split distributions
        run: |
          mkdir -p dist-sdk dist-cli
          mv dist/notamify_sdk-* dist-sdk/
          mv dist/notamify-* dist-cli/
          ls dist-sdk dist-cli

      - name: Publish notamify-sdk to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-sdk
          skip-existing: true

      - name: Publish notamify to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-cli
          skip-existing: true

  github-release:
    needs:
      - build
      - publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: release-dists
          path: dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --generate-notes --verify-tag
